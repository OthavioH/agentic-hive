name: agentic_hive_backend
description: Local Agentic Hive backend server.
version: 0.3.0
publish_to: none
resolution: workspace

executables:
  server:
  hive_mcp:

environment:
  sdk: ^3.14.0

dependencies:
  agentic_hive_shared:
    path: ../shared
  args: ^2.7.0
  crypto: ^3.0.8
  dart_mcp: ^0.5.2
  drift: ^2.35.4
  ffi: ^2.2.0
  get_it: ^9.3.0
  logging: ^1.3.0
  path: ^1.9.1
  shelf: ^1.4.3
  shelf_router: ^1.1.5
  shelf_web_socket: ^3.0.0
  watcher: ^1.2.1
  web_socket_channel: ^3.0.3
  win32: ^6.4.0
  yaml: ^3.1.4

dev_dependencies:
  # Pinned <2.17.0 for compatibility with widgetbook_generator ^3.24.0
  # (which requires build ^4.0.0).
  build_runner: ">=2.16.1 <2.17.0"
  drift_dev: ^2.35.3
  test: ^1.25.0
  very_good_analysis: ^11.0.0
