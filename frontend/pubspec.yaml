  json_annotation: ^4.12.0
  material_ui: ^1.11.1
  nativeapi: ^0.6.1
  path: ^1.9.1
  riverpod_annotation: ^4.0.8
  tray_manager: ^0.9.0
  window_manager: ^0.7.0

dev_dependencies:
  build_runner: ">=2.16.1 <2.17.0"
  flutter_test:
    sdk: flutter
  freezed: ">=4.0.0 <4.0.2"
  go_router_builder: ^4.5.3
  json_serializable: ^6.15.2
