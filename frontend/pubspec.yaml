name: agentic_hive_frontend
description: Agentic Hive Flutter desktop application.
version: 0.4.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.1"

dependencies:
  agentic_hive_shared:
    path: ../shared
  cupertino_ui: ^1.1.7
  design_system:
    path: ../design_system
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
