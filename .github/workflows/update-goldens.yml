name: Update Goldens

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-goldens:
    name: Update Golden Baselines (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Update design_system goldens
        working-directory: design_system
        run: flutter test --tags golden --update-goldens

      - name: Commit and push updated goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "design_system/test/goldens/**/*.png"
          if git diff --cached --quiet; then
            echo "No golden baseline changes to commit."
            exit 0
          fi
          git commit -m "chore(design_system): update Ubuntu golden baselines"
          git push
