name: Release

on:
  push:
    tags: ['v*']
    branches: ['OthavioH/rel-95-workflow']   # TEMPORARY: lets the workflow run once before it exists on master; remove before merge
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read and check the product version
        id: read
        run: |
          read_version() {
            sed -n -E 's/^version:[[:space:]]*([0-9A-Za-z.-]+).*$/\1/p' "$1/pubspec.yaml"
          }
          version="$(read_version frontend)"
          if [ -z "$version" ]; then
            echo "::error::frontend/pubspec.yaml has no version."
            exit 1
          fi
          for pkg in backend shared; do
            other="$(read_version "$pkg")"
            if [ "$other" != "$version" ]; then
              echo "::error::$pkg/pubspec.yaml is at '$other' but frontend/pubspec.yaml is at '$version'."
              exit 1
            fi
          done
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the frontend version v$version."
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/master; then
              echo "::error::Tag $GITHUB_REF_NAME does not point to a commit on master."
              exit 1
            fi
          fi
          echo "Product version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            flutter_output: frontend/build/windows/x64/runner/Release
            archive_ext: zip
          - os: ubuntu-latest
            platform: linux
            flutter_output: frontend/build/linux/x64/release/bundle
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUNDLE_DIR: ${{ matrix.flutter_output }}
      ROOT_NAME: agentic-hive-${{ needs.version.outputs.version }}
      ARCHIVE_NAME: agentic-hive-${{ needs.version.outputs.version }}-${{ matrix.platform }}-x64.${{ matrix.archive_ext }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Generate code (pub get + build_runner + gen-l10n)
        run: dart run tool/codegen.dart

      - name: Build the app (release)
        working-directory: frontend
        run: flutter build ${{ matrix.platform }} --release

      - name: Build the backend into the Bundle (dart build cli)
        run: dart run tool/build_backend_bundle.dart "$BUNDLE_DIR"

      - name: Add the Visual C++ runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item -Path (Join-Path $env:WINDIR "System32\$dll") -Destination $env:BUNDLE_DIR -ErrorAction Stop
          }

      - name: Smoke test the Bundle
        run: dart run tool/smoke_bundle.dart "$BUNDLE_DIR"

      - name: Stage the Bundle
        run: |
          mkdir -p dist
          cp -R "$BUNDLE_DIR" "dist/$ROOT_NAME"
          ls -la "dist/$ROOT_NAME" "dist/$ROOT_NAME/backend/bin" "dist/$ROOT_NAME/backend/lib"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:ROOT_NAME" -DestinationPath "dist/$env:ARCHIVE_NAME"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "dist/$ARCHIVE_NAME" -C dist "$ROOT_NAME"

      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.ARCHIVE_NAME }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish pre-release
    needs: [version, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agentic-hive-${{ needs.version.outputs.version }}-windows-x64.zip
          path: release
          skip-decompress: true

      - uses: actions/download-artifact@v8
        with:
          name: agentic-hive-${{ needs.version.outputs.version }}-linux-x64.tar.gz
          path: release
          skip-decompress: true

      - name: Write SHA256SUMS
        working-directory: release
        run: |
          ls -la
          sha256sum "agentic-hive-$VERSION-windows-x64.zip" "agentic-hive-$VERSION-linux-x64.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Create the GitHub pre-release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(cat <<'EOF'
          **Unsigned build.** These binaries are not code-signed. On Windows, SmartScreen may show "Windows protected your PC": choose **More info**, then **Run anyway**. Verify your download with `SHA256SUMS` (`sha256sum -c SHA256SUMS --ignore-missing`).

          Extract the archive and run `agentic_hive` (`agentic_hive.exe` on Windows) from the `agentic-hive-<version>/` folder. Keep the `backend/` folder next to it.
          EOF
          )"
          gh release create "$GITHUB_REF_NAME" \
            "agentic-hive-$VERSION-windows-x64.zip" \
            "agentic-hive-$VERSION-linux-x64.tar.gz" \
            SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "Agentic Hive $VERSION" \
            --notes "$notes"
