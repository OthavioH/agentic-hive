name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    # spec/** carries the ticket PRs of the Spec Implementation workflow.
    branches: [master, development, 'spec/**']

jobs:
  workspace:
    name: Workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Generate code (build_runner + gen-l10n)
        run: dart run tool/codegen.dart

      - name: Analyze (zero issues, infos included)
        run: dart analyze --fatal-infos

      - name: Check dart fix has nothing to apply
        shell: bash
        run: |
          output="$(dart fix --dry-run)"
          echo "$output"
          echo "$output" | grep -q "Nothing to fix!"

      - name: Test tools
        run: dart test

      - name: Test shared
        working-directory: shared
        run: dart test

      - name: Test backend
        working-directory: backend
        run: dart test

      - name: Test hive_lints
        working-directory: tools/hive_lints
        run: dart test

      - name: Test design_system (non-golden)
        working-directory: design_system
        run: flutter test --exclude-tags golden

      - name: Test design_system (goldens, Ubuntu only)
        if: runner.os == 'Linux'
        working-directory: design_system
        run: flutter test --tags golden

      - name: Test widgetbook
        working-directory: widgetbook
        run: flutter test

      # very_good test bundles the test files into one entrypoint (about 6x
      # faster than flutter test); files tagged skip_very_good_optimization run
      # on their own.
      - name: Test frontend
        working-directory: frontend
        run: |
          dart pub global activate very_good_cli 1.7.0
          dart pub global run very_good_cli:very_good test

      - name: Build widgetbook (Windows)
        if: runner.os == 'Windows'
        working-directory: widgetbook
        run: flutter build windows --debug

      - name: Build widgetbook (Linux)
        if: runner.os == 'Linux'
        working-directory: widgetbook
        run: flutter build linux --debug

      - name: Build widgetbook (macOS)
        if: runner.os == 'macOS'
        working-directory: widgetbook
        run: flutter build macos --debug

      - name: Build frontend (Windows)
        if: runner.os == 'Windows'
        working-directory: frontend
        run: flutter build windows --debug

      - name: Build frontend (Linux)
        if: runner.os == 'Linux'
        working-directory: frontend
        run: flutter build linux --debug

      - name: Build frontend (macOS)
        if: runner.os == 'macOS'
        working-directory: frontend
        run: flutter build macos --debug
